<svg xmlns="http://www.w3.org/2000/svg" viewBox="13.5 14 223 223" width="64" height="64" role="img" aria-label="To写作工作台">
  <!-- To 写作工作台 · 标签页图标（简化版，源文件 logo/to-icon.svg）：
       实心羽毛笔，羽轴留一道细缝；堇紫笔尖下方落一滴淡墨，墨心透出紫光。
       深色标签栏下羽毛换成宣纸色，墨滴提亮一档，保证看得清。 -->
  <style>
    .q{fill:#1E1B1A}.n,.c{fill:#6F63E6}.d{fill:#5B5650}
    @media (prefers-color-scheme:dark){.q{fill:#EEEAE1}.n,.c{fill:#8A7FF2}.d{fill:#8A847C}}
  </style>
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="240">
      <rect width="240" height="240" fill="#fff"/>
      <path d="M1 -80 C2 -30 2 20 1 58" transform="translate(140 100) rotate(28)" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
    </mask>
  </defs>
  <g mask="url(#cut)"><g class="q" transform="translate(140 100) rotate(28)">
    <path d="M0 -95 C34 -66 42 -16 24 34 C18 48 8 58 2 62 L-2 62 C-16 52 -30 36 -34 14 C-42 -24 -26 -68 0 -95 Z"/>
  </g></g>
  <path class="n" d="M-3.5 62 L5.5 62 L1.6 102 L0.4 102 Z" transform="translate(140 100) rotate(28)"/>
  <circle class="d" cx="80" cy="214" r="21"/>
  <circle class="c" cx="80" cy="214" r="9"/>
</svg>
